[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openliyadi"
version = "0.1.0"
description = "Open BLE control for Liyadi RGB lights (LP540-PRO & co)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["bleak>=3.0"]

[project.optional-dependencies]
windows = [
    "winrt-Windows.Devices.Bluetooth>=3.2",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.2",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2",
    "winrt-Windows.Devices.Enumeration>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
    "winrt-Windows.Foundation>=3.2",
]
web = ["fastapi>=0.120", "uvicorn>=0.34", "pydantic>=2.0"]
ambilight = ["mss>=10.0"]
music = ["soundcard>=0.4", "numpy>=1.11"]
all = [
    "winrt-Windows.Devices.Bluetooth>=3.2",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.2",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2",
    "winrt-Windows.Devices.Enumeration>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "fastapi>=0.120",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "mss>=10.0",
]

[tool.setuptools.packages.find]
include = ["openliyadi*"]
