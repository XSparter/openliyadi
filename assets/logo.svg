<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="0.5" stop-color="#00e05a"/>
      <stop offset="1" stop-color="#2d7bff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="200" rx="36" fill="#0f1115"/>
  <g transform="rotate(-6 105 100)">
    <rect x="45" y="52" width="120" height="96" rx="14" fill="#1a1d24" stroke="url(#frame)" stroke-width="5"/>
    <g filter="url(#glow)">
      <circle cx="75" cy="78" r="7" fill="#ff2d2d"/>
      <circle cx="105" cy="78" r="7" fill="#ff8c00"/>
      <circle cx="135" cy="78" r="7" fill="#ffe600"/>
      <circle cx="75" cy="104" r="7" fill="#00e05a"/>
      <circle cx="105" cy="104" r="7" fill="#ffffff"/>
      <circle cx="135" cy="104" r="7" fill="#00e0ff"/>
      <circle cx="75" cy="130" r="7" fill="#2d7bff"/>
      <circle cx="105" cy="130" r="7" fill="#8b2bff"/>
      <circle cx="135" cy="130" r="7" fill="#ff2bd1"/>
    </g>
    <rect x="97" y="148" width="16" height="14" rx="3" fill="#2d323f"/>
  </g>
  <text x="200" y="106" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#f0f2f5">openliyadi</text>
  <text x="202" y="140" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" fill="#8a919e">open BLE control for Liyadi RGB lights</text>
</svg>
